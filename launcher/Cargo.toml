[package]
name = "nvim-dc"
version = "0.1.0"
edition = "2024"
description = "Launch Neovim in a container that can create and connect to devcontainers"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
